name: Reusable Kubernetes Setup

on:
  workflow_call:
    secrets:
      kubeconfig_data:
        required: true

jobs:
  kubectl:
    runs-on: ubuntu-latest

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.kubeconfig_data }}" | base64 -d > $HOME/.kube/config

      - name: Verify cluster
        run: kubectl get nodes
