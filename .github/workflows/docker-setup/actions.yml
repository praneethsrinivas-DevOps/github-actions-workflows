name: Reusable Docker Setup

on:
  workflow_call:
    secrets:
      ghcr_token:
        required: true
    inputs:
      github_user:
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.github_user }}
          password: ${{ secrets.ghcr_token }}
