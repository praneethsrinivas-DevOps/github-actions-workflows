name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      registry:
        required: true
        type: string
      github_user:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      ghcr_token:
        required: true
    outputs:
      full_image:
        description: "Full image name with tag"
        value: ${{ jobs.build.outputs.full_image }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Tag
        id: tag
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          TAG=${{ inputs.branch }}-$SHORT_SHA
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.ghcr_token }}" | docker login ghcr.io -u ${{ inputs.github_user }} --password-stdin

      - name: Build Image
        run: |
          FULL_IMAGE=${{ inputs.registry }}/${{ inputs.github_user }}/${{ inputs.image_name }}:$TAG
          docker build -t $FULL_IMAGE .
          docker push $FULL_IMAGE
          echo "full_image=$FULL_IMAGE" >> $GITHUB_OUTPUT
        id: meta
